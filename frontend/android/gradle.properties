org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 这一行看着像性能退步，但它是必需的 —— 不要删。
#
# Kotlin 增量编译要记录「每个源文件相对于项目根的路径」，用的是 Kotlin 的
# relativeTo()。而本项目的插件源码来自 pub 缓存，路径是
#   C:\Users\<user>\AppData\Local\Pub\Cache\...
# 项目却在 D 盘，于是 relativeTo() 抛
#   IllegalArgumentException: this and base files have different roots
# 该异常发生在**编译完成、关闭增量缓存**那一步，所以报出来的错是
#   "Could not close incremental caches ... class-fq-name-to-source.tab"
# 外加一句极具误导性的 "e: Daemon compilation failed" —— 看起来像我们的
# Kotlin 代码写错了，或者缓存损坏了。清 build/ 目录没有用，因为每次重编译
# 都会再撞一次；换个 build 目录也没用，因为问题出在源文件路径上。
#
# 根因是**项目目录与 pub 缓存目录不同盘符**。两条路可选：
#   ① 关掉增量编译（此处）—— 只影响构建速度，插件本就只编译一次；
#   ② 把 PUB_CACHE 也放到 D 盘，保留增量编译，但要重下所有依赖且影响全局。
# 选了 ①：这是项目级配置，不污染机器上其他 Flutter 工程。
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
